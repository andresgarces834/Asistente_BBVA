<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistente BBVA Colombia</title>
<style>
  :root {
    --fondo: #f4f6f9; --superficie: #ffffff; --texto: #1c2430; --suave: #5d6b7c;
    --borde: #dbe2ea; --acento: #1464a5; --sobre-acento: #ffffff;
    --burbuja-usuario: #1464a5; --error: #9b1c13; --error-fondo: #fdecea;
    --aviso: #7a4b00; --aviso-fondo: #fff4dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #0f141b; --superficie: #18202a; --texto: #e8edf3; --suave: #9aa8b8;
      --borde: #2a3442; --acento: #5aaeea; --sobre-acento: #06111b;
      --burbuja-usuario: #1d5f94; --error: #f4bdb9; --error-fondo: #3b1f1d;
      --aviso: #f3d28b; --aviso-fondo: #3a2e12;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column; height: 100dvh;
    background: var(--fondo); color: var(--texto);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header, #aviso, #chat, form, .nota { width: 100%; max-width: 860px; margin: 0 auto; }
  header {
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
    justify-content: space-between; padding: 14px 16px 10px;
  }
  h1 { margin: 0; font-size: 1.15rem; }
  header p { margin: 0; color: var(--suave); font-size: .85rem; }
  .sesion { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: .85rem; color: var(--suave); }
  .sesion button { white-space: nowrap; }
  code { background: var(--superficie); border: 1px solid var(--borde); border-radius: 6px; padding: 2px 7px; color: var(--texto); }
  button {
    font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--borde);
    background: var(--superficie); color: var(--texto); padding: 4px 10px;
  }
  button:hover:not(:disabled) { border-color: var(--acento); }
  button:disabled { opacity: .55; cursor: default; }
  #aviso { margin-bottom: 8px; padding: 10px 14px; border-radius: 10px; background: var(--aviso-fondo); color: var(--aviso); font-size: .9rem; }
  #aviso[hidden] { display: none; }

  #chat { flex: 1; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
  .bienvenida { margin: auto; text-align: center; color: var(--suave); padding: 24px 8px; }
  .bienvenida h2 { color: var(--texto); font-size: 1.25rem; margin: 0 0 6px; }
  .sugerencias { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .sugerencias button { text-align: left; padding: 8px 12px; background: var(--superficie); }

  .msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; overflow-wrap: anywhere; }
  .msg.usuario { align-self: flex-end; background: var(--burbuja-usuario); color: #fff; white-space: pre-wrap; border-bottom-right-radius: 4px; }
  .msg.asistente { align-self: flex-start; background: var(--superficie); border: 1px solid var(--borde); border-bottom-left-radius: 4px; }
  .msg.sin-respuesta { color: var(--suave); }
  .msg.error { align-self: stretch; max-width: 100%; background: var(--error-fondo); border-color: transparent; color: var(--error); }
  .cuerpo p { margin: 0 0 .5em; } .cuerpo p:last-child { margin-bottom: 0; }
  .cuerpo ul, .cuerpo ol { margin: .3em 0 .5em; padding-left: 1.3em; }
  .cuerpo code { font-size: .9em; }
  details.fuentes { margin-top: 8px; font-size: .85rem; color: var(--suave); }
  details.fuentes summary { cursor: pointer; }
  details.fuentes ul { margin: 6px 0 0; padding-left: 1.2em; }
  details.fuentes a { color: var(--acento); }
  .meta { margin-top: 6px; font-size: .75rem; color: var(--suave); }

  .puntos i { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%; background: var(--suave); animation: salto 1s infinite; }
  .puntos i:nth-child(2) { animation-delay: .15s; } .puntos i:nth-child(3) { animation-delay: .3s; }
  @keyframes salto { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }

  form { display: flex; gap: 8px; padding: 8px 16px 6px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; font: inherit; color: var(--texto); background: var(--superficie);
    border: 1px solid var(--borde); border-radius: 12px; padding: 10px 12px; max-height: 160px;
  }
  textarea:focus { outline: 2px solid var(--acento); border-color: transparent; }
  #enviar { background: var(--acento); color: var(--sobre-acento); border: 0; padding: 10px 18px; border-radius: 12px; font-weight: 600; }
  .nota { padding: 0 16px 12px; font-size: .75rem; color: var(--suave); text-align: center; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Asistente BBVA Colombia</h1>
    <p>Responde con el contenido público de bbva.com.co</p>
  </div>
  <div class="sesion">
    <span>Conversación</span><code id="sid"></code>
    <button id="nueva" type="button">Nueva</button>
    <button id="cargar" type="button">Cargar ID</button>
  </div>
</header>

<div id="aviso" hidden></div>
<main id="chat" aria-live="polite"></main>

<form id="form">
  <textarea id="entrada" rows="1" maxlength="1000" placeholder="Escribe tu pregunta…" aria-label="Pregunta"></textarea>
  <button id="enviar" type="submit">Enviar</button>
</form>
<p class="nota">Las respuestas las genera un modelo local a partir de las páginas públicas de BBVA Colombia. Verifica los datos importantes en el sitio oficial.</p>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const chat = $("#chat"), form = $("#form"), entrada = $("#entrada"), enviar = $("#enviar");
  const aviso = $("#aviso"), sid = $("#sid");
  const PATRON_ID = /^[A-Za-z0-9_-]{1,64}$/;

  let sessionId = leerId();
  let ocupado = false;

  // ---------- ID de conversación (se recuerda entre visitas) ----------
  function crearId() {
    const bytes = new Uint8Array(6);
    if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(bytes);
    else for (let i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
    return Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
  }
  function leerId() {
    try { const id = localStorage.getItem("session_id"); if (id && PATRON_ID.test(id)) return id; } catch (e) {}
    return crearId();
  }
  function guardarId(id) {
    sessionId = id; sid.textContent = id;
    try { localStorage.setItem("session_id", id); } catch (e) {}
  }

  // ---------- Texto seguro: se escapa todo antes de dar formato ----------
  const escapar = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const enLinea = (s) => s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`(.+?)`/g, "<code>$1</code>");
  function markdown(texto) {
    let html = "", lista = null;
    const cerrar = () => { if (lista) { html += "</" + lista + ">"; lista = null; } };
    for (const linea of escapar(texto).split("\n")) {
      let m;
      if ((m = linea.match(/^\s*[-*]\s+(.*)$/))) {
        if (lista !== "ul") { cerrar(); html += "<ul>"; lista = "ul"; }
        html += "<li>" + enLinea(m[1]) + "</li>";
      } else if ((m = linea.match(/^\s*\d+[.)]\s+(.*)$/))) {
        if (lista !== "ol") { cerrar(); html += "<ol>"; lista = "ol"; }
        html += "<li>" + enLinea(m[1]) + "</li>";
      } else if (linea.trim() === "") { cerrar(); }
      else { cerrar(); html += "<p>" + enLinea(linea) + "</p>"; }
    }
    cerrar();
    return html;
  }

  // ---------- Pintar mensajes ----------
  const bajar = () => { chat.scrollTop = chat.scrollHeight; };
  function burbuja(clase) {
    const d = document.createElement("div");
    d.className = "msg " + clase;
    chat.appendChild(d);
    return d;
  }
  const segundos = (ms) => (ms / 1000).toFixed(1).replace(".", ",") + " s";

  function pintarMensaje(m) {
    if (m.rol === "user") { burbuja("usuario").textContent = m.contenido; bajar(); return; }

    const d = burbuja("asistente" + (m.sin_respuesta ? " sin-respuesta" : ""));
    const cuerpo = document.createElement("div");
    cuerpo.className = "cuerpo";
    cuerpo.innerHTML = markdown(m.contenido);
    d.appendChild(cuerpo);

    if (m.fuentes && m.fuentes.length && !m.sin_respuesta) {
      const det = document.createElement("details");
      det.className = "fuentes";
      det.innerHTML = "<summary>Fuentes (" + m.fuentes.length + ")</summary>";
      const ul = document.createElement("ul");
      for (const f of m.fuentes) {
        const li = document.createElement("li");
        if (/^https?:\/\//.test(f.url)) {
          const a = document.createElement("a");
          a.href = f.url; a.target = "_blank"; a.rel = "noopener noreferrer";
          a.textContent = f.titulo || f.url;
          li.appendChild(a);
        } else { li.textContent = f.titulo; }
        ul.appendChild(li);
      }
      det.appendChild(ul);
      d.appendChild(det);
    }

    const partes = [];
    if (m.latencia_ms != null) partes.push(segundos(m.latencia_ms));
    if (m.pregunta_reescrita) partes.push("Buscado como: «" + m.pregunta_reescrita + "»");
    if (partes.length) {
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = partes.join(" · ");
      d.appendChild(meta);
    }
    bajar();
  }
  function pintarError(texto) {
    burbuja("asistente error").textContent = texto;
    bajar();
  }
  function bienvenida() {
    const d = document.createElement("div");
    d.className = "bienvenida";
    d.innerHTML = "<h2>¿En qué te puedo ayudar?</h2><p>Pregúntame por los productos y servicios de BBVA Colombia.</p>";
    const caja = document.createElement("div");
    d.appendChild(caja);
    chat.appendChild(d);
  }

  // ---------- Comunicación con la API ----------
  async function leerJSON(respuesta) {
    try { return await respuesta.json(); } catch (e) { return null; }
  }
  function textoDeError(datos, estado) {
    const d = datos && datos.detail;
    if (typeof d === "string") return d;
    if (Array.isArray(d)) return "La pregunta no es válida: debe tener entre 1 y 1000 caracteres.";
    return "El servidor respondió con un error (" + estado + ").";
  }

  async function cargarConversacion() {
    chat.innerHTML = "";
    try {
      const r = await fetch("/api/sesiones/" + encodeURIComponent(sessionId) + "/mensajes");
      const datos = await leerJSON(r);
      if (r.ok && datos && datos.mensajes.length) { datos.mensajes.forEach(pintarMensaje); return; }
    } catch (e) { /* sin historial: se muestra la bienvenida */ }
    bienvenida();
  }

  async function comprobarEstado() {
    try {
      const r = await fetch("/api/salud");
      const s = await leerJSON(r);
      if (!r.ok || !s) return;
      if (s.detalle) { aviso.textContent = "El modelo no está disponible. " + s.detalle; aviso.hidden = false; }
      else if (s.fragmentos === 0) { aviso.textContent = "La base vectorial está vacía. Ejecuta primero el indexador."; aviso.hidden = false; }
    } catch (e) {}
  }

  async function preguntar(texto) {
    texto = texto.trim();
    if (ocupado || !texto) return;
    ocupado = true; enviar.disabled = true;

    const inicio = chat.querySelector(".bienvenida");
    if (inicio) inicio.remove();
    pintarMensaje({ rol: "user", contenido: texto });
    const espera = burbuja("asistente");
    espera.innerHTML = '<span class="puntos"><i></i><i></i><i></i></span>';
    bajar();

    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, pregunta: texto }),
      });
      const datos = await leerJSON(r);
      espera.remove();
      if (!r.ok || !datos) throw new Error(textoDeError(datos, r.status));
      pintarMensaje(datos);
    } catch (e) {
      espera.remove();
      pintarError(e instanceof TypeError ? "No se pudo conectar con el servidor." : e.message);
    } finally {
      ocupado = false; enviar.disabled = false; entrada.focus();
    }
  }

  // ---------- Eventos ----------
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const texto = entrada.value;
    entrada.value = ""; ajustarAlto();
    preguntar(texto);
  });
  entrada.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
  function ajustarAlto() {
    entrada.style.height = "auto";
    const bordes = entrada.offsetHeight - entrada.clientHeight;  // scrollHeight no los incluye
    entrada.style.height = Math.min(entrada.scrollHeight + bordes, 160) + "px";
  }
  entrada.addEventListener("input", ajustarAlto);

  $("#nueva").addEventListener("click", () => { if (ocupado) return; guardarId(crearId()); cargarConversacion(); entrada.focus(); });
  $("#cargar").addEventListener("click", () => {
    if (ocupado) return;
    const id = (prompt("ID de la conversación que quieres cargar:") || "").trim();
    if (!id) return;
    if (!PATRON_ID.test(id)) { alert("El ID solo puede tener letras, números, guion y guion bajo (máximo 64)."); return; }
    guardarId(id); cargarConversacion();
  });

  guardarId(sessionId);
  cargarConversacion();
  comprobarEstado();
  entrada.focus();
})();
</script>
</body>
</html>
